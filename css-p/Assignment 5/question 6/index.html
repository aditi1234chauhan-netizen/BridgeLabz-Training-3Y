<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Nature Photo Gallery</h1>

<div class="gallery">

    <div class="photo">
        <img src="img1.jpg" alt="Mountain">
        <div class="caption">Mountain</div>
    </div>

    <div class="photo">
        <img src="img2.jpg" alt="Forest">
        <div class="caption">Forest</div>
    </div>

    <div class="photo">
        <img src="img3.jpg" alt="River">
        <div class="caption">River</div>
    </div>

    <div class="photo">
        <img src="img4.jpg" alt="Beach">
        <div class="caption">Beach</div>
    </div>

    <div class="photo">
        <img src="img5.jpg" alt="Sunset">
        <div class="caption">Sunset</div>
    </div>

    <div class="photo">
        <img src="img6.jpg" alt="Flowers">
        <div class="caption">Flowers</div>
    </div>

</div>

</body>
</html>
