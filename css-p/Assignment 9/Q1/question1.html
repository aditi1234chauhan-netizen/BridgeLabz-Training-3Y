<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="question1.css">
</head>
<body>
  <header><h1>Image Filter Gallery</h1></header>
  <main>
    <section class="gallery" aria-label="Filtered image gallery">
      <figure><img class="blur" src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=600" alt="Landscape"><figcaption>Blur</figcaption></figure>
      <figure><img class="grayscale" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600" alt="Mountain landscape"><figcaption>Grayscale</figcaption></figure>
      <figure><img class="sepia" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Nature"><figcaption>Sepia</figcaption></figure>
      <figure><img class="brightness" src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?w=600" alt="Plant"><figcaption>Brightness</figcaption></figure>
      <figure><img class="contrast" src="https://images.unsplash.com/photo-1511497584788-876760111969?w=600" alt="Forest"><figcaption>Contrast</figcaption></figure>
      <figure><img class="hue" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600" alt="Lake"><figcaption>Hue Rotate</figcaption></figure>
    </section>
  </main>
  <footer><p>Responsive CSS Assignment - Q1</p></footer>
</body>
</html>
