<body>
  <main>
    <h1>Responsive CSS Cheat Sheet</h1>
    <section class="cheat-sheet">
      <article><h2>Filters</h2><p>Use filter: grayscale(100%); to change an image appearance.</p></article>
      <article><h2>Media Queries</h2><p>Use @media (max-width: 700px) to adapt styles.</p></article>
      <article><h2>Responsive Design</h2><p>Use flexible layouts that adapt to different screen sizes.</p></article>
      <article><h2>Typography</h2><p>Use clamp() for scalable font sizes.</p></article>
    </section>
  </main>
</body>
