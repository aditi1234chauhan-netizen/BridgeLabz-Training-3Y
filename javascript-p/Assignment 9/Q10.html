<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Q10 - Registration Form Validation</title>
<style>body{font-family:Arial;margin:30px;background:#f6f8fb}.panel{max-width:450px;background:white;padding:22px;border-radius:10px}label{display:block;margin-top:12px}input{display:block;width:95%;padding:9px;margin-top:5px;border:1px solid #bbb;border-radius:5px}.invalid{border:2px solid red!important}button{margin-top:15px;padding:10px 16px}#result{margin-top:12px}</style></head><body>
<div class="panel"><h1>Registration</h1><form id="register" novalidate>
<label>Name<input id="name" type="text" autocomplete="name"></label>
<label>Email<input id="email" type="email" autocomplete="email"></label>
<label>Password<input id="password" type="password" autocomplete="new-password"></label>
<button type="submit">Register</button></form><p id="result" aria-live="polite"></p></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="Q10.js"></script></body></html>
