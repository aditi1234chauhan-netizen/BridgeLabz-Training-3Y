<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Step Form</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Multi-Step Form</h1>
<form id="multiForm">
<section class="step"><label>Name</label><input id="name" required placeholder="Your name"></section>
<section class="step" hidden><label>Email</label><input id="email" type="email" required placeholder="name@example.com"></section>
<section class="step" hidden><label>Password</label><input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></section>
<p id="error" class="error"></p><button type="button" id="backButton">Back</button>
<button type="button" id="nextButton">Next</button>
</form><div id="summary" hidden></div></main><script src="script.js"></script></body></html>
