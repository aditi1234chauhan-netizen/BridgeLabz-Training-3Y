<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Submit Blocker</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>Form Validation</h1><form id="detailsForm" novalidate>
<label>Name</label><input id="name" type="text"><small class="error" id="nameError"></small>
<label>Email</label><input id="email" type="text"><small class="error" id="emailError"></small>
<label>Password</label><input id="password" type="password"><small class="error" id="passwordError"></small>
<button type="submit">Submit</button></form><p id="success" class="success"></p></main>
<script src="script.js"></script></body></html>
